{id:"mpc-ot",title:"MPC and oblivious transfer",level:5,kind:"Privacy preserving",status:"Concept lesson",
 summary:"Secure multiparty computation lets several parties compute a function of their private inputs without revealing the inputs. Oblivious transfer lets one party get one of several values without revealing which one.",
 mental:"A group computation where nobody sees the others' inputs",
 mentalText:"Everyone contributes a private number. The computation runs. The output is public. The inputs stay secret.",
 steps:["Parties agree on the function and the protocol.","Each party secret shares its input.","The parties compute the function on the shares.","The output is reconstructed from the final shares.","No party ever sees another party's input."],
 pseudo:"Oblivious transfer (1 out of 2):\n  Sender has m0, m1\n  Receiver has choice bit c\n  Result: receiver learns m_c, learns nothing about m_{1-c}\n          sender learns nothing about c\n\nGarbled circuits:\n  Sender garbles a Boolean circuit\n  Receiver evaluates it with its own input\n  Receiver learns only the output",
 uses:"Privacy preserving auctions, secure voting, private set intersection, anonymous credentials, genomics, medical research.",
 strength:"Strong privacy guarantees even against a curious party. Multiple threat models (semi honest, malicious) with different protocols.",
 limits:"Computation and communication cost are much higher than plain computation. Malicious security is significantly more expensive.",
 pitfall:"MPC protects the inputs from the other parties. It does not protect the output from being leaked by a party that learns it. Output privacy needs additional techniques.",
 question:"What is the difference between semi honest and malicious security in MPC?",
 answer:"Semi honest (also called passive) assumes every party follows the protocol but tries to learn extra information from what they see. Malicious (active) assumes a party may deviate arbitrarily from the protocol, and the security proof must handle this.",
 demo:"none",sample:"",inputKind:"text"},
{id:"garbled-circuits",title:"Garbled circuits",level:5,kind:"MPC technique",status:"Concept lesson",
 summary:"A garbled circuit lets one party evaluate a function on another party's input without learning what that input is. The circuit is encrypted so that only the correct wire values can be unlocked.",
 mental:"A locked puzzle box that only opens with the right key",
 mentalText:"Each wire in the circuit carries two possible labels. The gates are encrypted so only the correct label opens the correct output. The evaluator only knows the labels it was given.",
 steps:["Represent the function as a Boolean circuit.","For each wire, pick two random labels (one for 0, one for 1).","For each gate, encrypt the output label for each input combination.","Shuffle the encrypted rows.","Sender sends the garbled circuit and its own input labels.","Receiver obtains its own input labels via oblivious transfer.","Receiver evaluates gate by gate and learns the output labels."],
 pseudo:"Garbling an AND gate:\n  Inputs:  a0, a1 (labels for wire A)\n           b0, b1 (labels for wire B)\n  Outputs: c0, c1 (labels for wire C)\n\n  Encrypt four rows:\n    Enc(a0, b0, c0)\n    Enc(a0, b1, c0)\n    Enc(a1, b0, c0)\n    Enc(a1, b1, c1)\n\n  Shuffle the rows. Send them to the evaluator.\n  The evaluator can only decrypt one row per gate.",
 uses:"Privacy preserving machine learning inference, secure auctions, private set intersection, two party protocols.",
 strength:"Constant rounds. Works for any function expressed as a circuit.",
 limits:"Circuit size grows with the complexity of the function. Garbling is expensive for large circuits.",
 pitfall:"The circuit structure itself is public. Only the input values are hidden. If the function must be hidden, additional techniques are needed.",
 question:"Why does the receiver need oblivious transfer for its input?",
 answer:"The receiver needs the label for its own input bit without revealing that bit to the sender. Oblivious transfer gives one label without telling the sender which one was chosen.",
 demo:"none",sample:"",inputKind:"text"},
{id:"homomorphic",title:"Homomorphic encryption",level:5,kind:"Privacy preserving",status:"Concept lesson",
 summary:"Homomorphic encryption lets you compute on encrypted data. The result, when decrypted, is the same as if you had computed on the plaintext.",
 mental:"A sealed box that you can still compute inside",
 mentalText:"Someone sends you encrypted numbers. You add or multiply them without decrypting. You send back the encrypted result. They decrypt and get the correct answer.",
 steps:["Generate a key pair. Encrypt the data.","Send the ciphertext to the server.","Server evaluates a circuit on the ciphertext.","Server sends back the encrypted result.","Client decrypts to get the plaintext result."],
 pseudo:"Fully homomorphic encryption supports both addition and multiplication:\n  Dec(Enc(a) + Enc(b)) = a + b\n  Dec(Enc(a) * Enc(b)) = a * b\n\nFamilies:\n  BFV       integer arithmetic, exact\n  BGV       integer arithmetic, exact\n  CKKS      approximate real numbers\n  TFHE      fast bootstrapping, boolean circuits, lookups\n\nNoise grows with each operation. Bootstrapping refreshes the ciphertext.",
 uses:"Private cloud computation, encrypted machine learning, private databases, medical analytics, privacy preserving advertising.",
 strength:"The server never sees the plaintext. All computation happens on ciphertext.",
 limits:"Very slow compared to plaintext computation. Ciphertexts and keys are large. Some operations need bootstrapping.",
 pitfall:"FHE is not a drop in replacement for normal computation. Algorithms must be redesigned for the noise budget and the cost of each operation.",
 question:"What is bootstrapping in homomorphic encryption?",
 answer:"Bootstrapping is a procedure that takes a noisy ciphertext and produces a fresh one with low noise, at the cost of running the decryption circuit homomorphically. It lets FHE support unlimited operations.",
 demo:"none",sample:"",inputKind:"text"},

{id:"diff-linear",title:"Differential and linear cryptanalysis",level:5,kind:"Cryptanalysis",status:"Concept lesson",
 summary:"Differential cryptanalysis studies how differences in the plaintext affect differences in the ciphertext. Linear cryptanalysis looks for linear relations between plaintext, ciphertext and key that hold more often than random.",
 mental:"Watching how changes propagate through the cipher",
 mentalText:"Flip one input bit. See which output bits change. Repeat many times. Small biases reveal the structure of the cipher.",
 steps:["Differential: choose pairs of plaintexts with a known difference.","Encrypt many pairs.","Count how often the output difference is a specific value.","Look for a differential that holds with probability much higher than random.","Linear: find a linear approximation of a component.","Combine approximations through the cipher to get a bias on the key bits."],
 pseudo:"Differential characteristic:\n  Input difference  delta_P\n  Output difference delta_C\n  Probability over all plaintexts and keys\n\nA good characteristic has high probability.\nThe number of pairs needed grows like 1 / probability.\n\nLinear approximation:\n  P[ parity of some input bits ]\n  XOR P[ parity of some output bits ]\n  XOR P[ parity of some key bits ] = 0\n  with probability 1/2 + epsilon\n\nA larger epsilon means fewer samples needed.",
 uses:"Analysis of DES, AES, and many other block ciphers. Modern ciphers are designed to resist these attacks (wide trail strategy in AES).",
 strength:"Fundamental to block cipher design. Every new cipher is tested against these attacks.",
 limits:"AES with its full round count is not broken by these attacks. They only break reduced round versions or weak designs.",
 pitfall:"A cipher that resists differential and linear cryptanalysis is not automatically secure. Many other attacks exist.",
 question:"Why is AES resistant to differential cryptanalysis?",
 answer:"AES uses the wide trail strategy: after two rounds, any active byte affects all 16 bytes of the state. This means the probability of a useful differential drops exponentially with rounds.",
 demo:"none",sample:"",inputKind:"text"},
{id:"padding-timing",title:"Padding oracles and timing attacks",level:4,kind:"Implementation attack",status:"Runnable teaching lab",
 summary:"A padding oracle is any behavior that tells an attacker whether a decrypted message has valid padding. A timing attack measures how long an operation takes to infer secret data.",
 mental:"Watching the reaction of the system, not the math",
 mentalText:"You cannot break the algorithm, so you watch how long it takes, how it responds when something fails, or whether the error message is different. That tells you what the secret data is.",
 steps:["Identify a place where the system behaves differently based on secret data.","Measure the difference in time or in response.","Send many crafted inputs.","Analyze the results statistically.","Recover the secret byte by byte."],
 pseudo:"Padding oracle attack on CBC:\n  Given ciphertext C = (C_0, C_1)\n  Modify C_0 byte by byte\n  Send to the server\n  If the server says valid padding, you know the last\n  byte of D(C_1) XOR C_0 equals 0x01\n  Solve for the plaintext byte\n  Repeat for each byte and each block\n\nTiming attack on string comparison:\n  for i in range(len(a)):\n    if a[i] != b[i]: return False   # timing leak\n  return True",
 invariant:"Any behavior that depends on secret data can leak that data. The fix is to make behavior independent of secrets: constant time, uniform responses, constant work per operation.",
 uses:"Security audits, real world attacks on TLS, ASP.NET, and many API implementations.",
 strength:"Often bypasses the mathematical security of the cipher. Targets implementation details.",
 limits:"Requires many queries in practice. Noise in the system makes measurement harder.",
 pitfall:"Returning different error messages for padding failure and MAC failure is the classic padding oracle. Return one uniform error for everything.",
 question:"How can you fix a padding oracle in a CBC based protocol?",
 answer:"Verify the MAC before decrypting and return the same error for any failure. Better, switch to an authenticated encryption mode such as AES-GCM or ChaCha20-Poly1305 where the ciphertext is authenticated as a whole.",
 demo:"timing",sample:"",inputKind:"text"},
{id:"cache-fault",title:"Cache attacks and fault injection",level:5,kind:"Side channel attack",status:"Concept lesson",
 summary:"Cache attacks observe which memory locations a program uses. Fault injection causes the hardware to make errors and observes the incorrect output to learn secrets.",
 mental:"Watching footprints in the snow and shaking the table at the right moment",
 mentalText:"A cache attack watches timing to see which memory the victim accessed. A fault attack makes a computation go wrong and looks at the wrong answer to extract information.",
 steps:["Cache timing: measure how long an operation takes.","Correlate timing with memory access patterns.","Determine which cache lines the victim touched.","Recover key bits from those patterns.","Fault injection: introduce a glitch in clock, voltage or light.","Observe incorrect output and analyze."],
 pseudo:"Prime and probe cache attack:\n  1. Fill the cache with your own data\n  2. Let the victim run\n  3. Measure access times to your data\n  4. Long times mean the victim evicted your line\n\nFault injection:\n  clock glitch: run the CPU faster than spec for one cycle\n  voltage glitch: drop the supply briefly\n  light: shine a laser on a chip\n  Result: wrong output that leaks information",
 uses:"Breaking implementations of AES without AES-NI, RSA signature schemes, and secure boot.",
 strength:"Very powerful when applicable. Can bypass algorithmic security.",
 limits:"Requires local access or a shared cache. Cloud environments are increasingly hardened.",
 pitfall:"AES without hardware support is vulnerable to cache attacks because it uses lookup tables indexed by secret data. Modern CPUs have AES-NI to avoid this.",
 question:"Why does AES software without AES-NI have a cache timing problem?",
 answer:"The SubBytes step uses an S-box lookup indexed by secret data. Different secret bytes touch different cache lines, and the access pattern can be observed through timing.",
 demo:"none",sample:"",inputKind:"text"},

{id:"lattice-reduction",title:"Lattice reduction (LLL and BKZ)",level:5,kind:"Cryptanalysis",status:"Concept lesson",
 summary:"Lattice reduction algorithms find short vectors in a lattice. They are used to attack lattice based cryptography, to break knapsack ciphers, and to find small solutions to polynomial equations.",
 mental:"Finding the shortest route through a very high dimensional grid",
 mentalText:"A lattice is a set of points in space. Reducing a basis means finding a shorter and more orthogonal set of basis vectors. Short vectors solve problems that look impossible otherwise.",
 steps:["Represent the problem as a lattice basis.","Apply LLL or BKZ to reduce the basis.","Look for a short vector in the reduced basis.","The short vector often solves the original problem.","If LLL is not enough, use BKZ with a larger block size."],
 pseudo:"LLL (Lenstra-Lenstra-Lovasz):\n  Input: basis B = (b_1, ..., b_n) of a lattice\n  Output: a reduced basis with shorter, more orthogonal vectors\n\n  Complexity: polynomial in the dimension and the bit size\n  Approximation factor: 2^((n-1)/2) times the shortest vector\n\nBKZ (Block Korkine-Zolotarev):\n  uses a subroutine on blocks of size beta\n  slower but finds shorter vectors\n  approximation factor improves with beta",
 uses:"Attacking lattice based cryptosystems, breaking early knapsack ciphers, solving Diophantine approximations, polynomial factoring.",
 strength:"The only known general purpose attack on many lattice based schemes. Also a powerful tool for finding small solutions.",
 limits:"LLL alone is not enough for modern lattice crypto. BKZ with very large blocks is needed and is expensive.",
 pitfall:"A lattice reduction attack on a parameter set does not mean the algorithm is broken. It means the parameters were too small. Use NIST recommended parameters.",
 question:"Why do lattice attacks matter for post quantum crypto?",
 answer:"ML-KEM and ML-DSA are lattice based. Their security depends on the hardness of lattice problems. Lattice reduction is the main tool cryptanalysts use to test whether the chosen parameters are strong enough.",
 demo:"none",sample:"",inputKind:"text"},
{id:"coppersmith-protocol",title:"Coppersmith methods and protocol misuse",level:5,kind:"Cryptanalysis",status:"Concept lesson",
 summary:"Coppersmith's method finds small roots of polynomials modulo N. It has broken RSA with small exponents and short messages. Protocol misuse covers attacks that break real systems by using crypto correctly in isolation but incorrectly together.",
 mental:"Finding small solutions that hide in plain sight",
 mentalText:"If the message is small enough and the exponent is small, you can find the message without factoring N. The math that makes RSA safe in general does not protect this corner case.",
 steps:["Identify a polynomial equation that the message satisfies.","Check whether the root is small enough for Coppersmith.","Apply lattice reduction to find the small root.","Recover the message or the key.","For protocol misuse: look at how primitives are combined.","Find where the same nonce, key or IV is reused."],
 pseudo:"Coppersmith for RSA:\n  Given C = M^e mod N with small e and small M\n  If M < N^(1/e) then M^e < N\n  So C = M^e over the integers, no modular reduction\n  Take the e-th root of C to get M\n\nHastad broadcast attack:\n  Same message sent to e recipients with exponent e\n  CRT combines the e ciphertexts\n  The combined value is M^e over the integers\n\nRelated message attack:\n  Same key, messages M and M + 1\n  Linear relation between the plaintexts leaks information",
 uses:"Historical attacks on RSA (small exponent, broadcast, related messages), attacks on improper protocol implementations, analysis of voting systems.",
 strength:"Very powerful against naive RSA and against protocols that reuse values.",
 limits:"Requires specific conditions. Modern RSA with OAEP and large exponents is not affected.",
 pitfall:"Textbook RSA with small e and no padding is broken. This is why OAEP exists. Never use raw RSA.",
 question:"Why is using e=3 with no padding dangerous for RSA?",
 answer:"If the message M is short enough that M^3 is less than N, then the ciphertext is exactly M^3 with no modular reduction. Anyone can take the cube root and recover M without factoring N.",
 demo:"none",sample:"",inputKind:"text"},
{id:"constant-time-stegano",title:"Constant time coding and steganography",level:4,kind:"Defensive techniques",status:"Runnable teaching lab",
 summary:"Constant time code avoids leaking secrets through timing or cache behaviour. Steganography hides the existence of a message, while steganalysis tries to detect it.",
 mental:"A careful walk that takes the same time no matter the path, and a hidden message in a picture",
 mentalText:"Constant time means every execution path takes the same time and touches the same memory. Steganography means the message itself is invisible.",
 steps:["Constant time: identify every branch and memory access that depends on secrets.","Replace branches with arithmetic that runs unconditionally.","Replace table lookups with bitwise operations or hardware instructions.","Steganography: choose a cover medium such as an image.","Embed the message in the low bits or in a transform domain.","Steganalysis: measure statistical anomalies in the medium."],
 pseudo:"Constant time comparison:\n  diff = 0\n  for i in range(len(a)):\n    diff |= a[i] ^ b[i]\n  return diff == 0\n\nConstant time selection (instead of if):\n  mask = -(condition)          # 0xFFFF... or 0\n  result = (x & mask) | (y & ~mask)\n\nLeast significant bit steganography:\n  for each bit of the message:\n    cover_byte &= 0xFE\n    cover_byte |= message_bit\n\nChi square steganalysis:\n  compare the observed distribution of LSB pairs\n  with the expected distribution of the cover image",
 uses:"Constant time coding in cryptographic libraries, HSMs and smart cards. Steganography in watermarking, covert channels, and CTF challenges.",
 strength:"Constant time code removes a class of implementation attacks. Steganography hides the fact that a message exists.",
 limits:"Constant time requires careful measurement to confirm. Steganography is easily detected if the embedding is naive.",
 pitfall:"A compiler may reintroduce branches or table lookups even if the source code looks constant time. Verify with timing tools and inspect the assembly.",
 question:"Why is a normal string comparison function unsafe for comparing MACs?",
 answer:"It returns as soon as it finds a mismatch. The time taken reveals how many bytes matched, so an attacker can guess a MAC one byte at a time. Use a constant time comparison instead.",
 demo:"constanttime",sample:"hello world",inputKind:"text"}
];

const PLAIN_GUIDES={"threat-models":{"plain":"Before building a security system, decide what you are protecting, who might attack it, and what that person can do. This plan is called a threat model. Kerckhoffs's principle adds one important rule: the design may be public; the secret key should provide the protection.","example":"A messaging app may assume that someone can watch the café Wi-Fi. The app should still hide the messages and check who sent them. Keeping the app's encryption design secret is not enough.","terms":[["Threat model","A written list of what needs protection, who might attack it, and what they can do."],["Key","A secret value that controls encryption or another security operation."],["Assumption","Something the design expects to be true, such as an attacker not having the phone unlocked."]]},"entropy-randomness":{"plain":"Entropy is a measure of how difficult a value is to guess. A value has more entropy when there are more possible outcomes and they are hard to predict. Making a value longer does not make it secure if the value came from a predictable source.","example":"A fair 20-sided die gives about 4.32 bits of uncertainty per roll. If you always roll the same die but secretly use a fixed sequence, the sequence is predictable and does not provide real randomness.","terms":[["Entropy","A measure of uncertainty in a source of values."],["Random source","A source whose next result cannot be reliably predicted."],["Seed","The starting value used to initialize a generator. A predictable seed can make every later output predictable."]]},"brute-force-sidechannels":{"plain":"A brute-force attack tries possible keys or passwords until one works. A side-channel attack learns clues from how a system behaves, such as how long it takes, how much power it uses, or which data its processor touches. These clues can reveal secrets without breaking the main mathematics.","example":"A four-digit PIN has 10,000 possible values. A brute-force attacker may try them all. A timing attacker instead watches whether the device responds slightly differently when the first digit is correct.","terms":[["Key space","All the possible keys or passwords an attacker could try."],["Brute force","Trying many possible answers until one works."],["Side channel","Information leaked by timing, power use, cache activity, sound, or another side effect."]]},"caesar-affine":{"plain":"A Caesar cipher moves every letter by the same number of places. An affine cipher adds one extra mathematical step, but it still follows a fixed letter pattern. These are useful for learning, not for protecting real messages, because an attacker can try every key quickly.","example":"With a Caesar shift of 3, A becomes D, B becomes E, and HELLO becomes KHOOR. To decode it, move each letter back by three places.","terms":[["Plaintext","The original readable message."],["Ciphertext","The scrambled message after encryption."],["Mod 26","Counting around a 26-letter alphabet and starting again after Z."]]},"substitution-vigenere":{"plain":"A substitution cipher replaces each letter using one scrambled alphabet. A Vigenere cipher uses a keyword to change the shift from letter to letter. The keyword makes the pattern less obvious, but a short repeating keyword still leaks clues and can be cracked.","example":"For a Vigenere cipher with keyword KEY, the first message letter is shifted by K, the second by E, and the third by Y. The keyword repeats until the message ends.","terms":[["Substitution","Replacing a symbol with another symbol."],["Keyword","A word used to control the letter shifts."],["Frequency analysis","Using how often letters appear to guess a hidden message."]]},"transposition-frequency":{"plain":"A transposition cipher keeps the same letters but changes their order. Frequency analysis counts how often each letter appears. Since transposition does not change the letters, the counts stay the same, which can help an attacker work out the message.","example":"If a message contains three E letters before scrambling, it still contains three E letters after rearranging. The letters may be in different positions, but the count has not changed.","terms":[["Transposition","Rearranging symbols without replacing them."],["Letter frequency","The share of a message made up by each letter."],["Kasiski examination","A method that uses repeated patterns to estimate the keyword length of a Vigenere cipher."]]},"otp-feistel":{"plain":"A one-time pad combines a message with a truly random key that is exactly as long as the message. It can be perfectly secret, but only if the key is never reused and both sides already have it securely. A Feistel network is a different design idea: it repeats simple mixing steps to build a block cipher.","example":"At the bit level, XOR follows 0 with 0 = 0, 0 with 1 = 1, 1 with 0 = 1, and 1 with 1 = 0. Using the same key twice is dangerous because it creates a relationship between the two encrypted messages.","terms":[["XOR","A bit operation that returns 1 when its two input bits differ."],["One-time pad","A perfectly secret method if its key is truly random, message-length, secret, and used only once."],["Feistel network","A repeated block-cipher structure that splits data into two halves and mixes them each round."]]},"aes-chacha20":{"plain":"AES and ChaCha20 are well-studied ways to encrypt data. AES works on 16-byte blocks. ChaCha20 creates a stream of key-dependent bytes and combines them with the message. Real systems also need a safe way to detect changes, such as AES-GCM or ChaCha20-Poly1305.","example":"Think of encryption as locking a box, and authentication as putting a tamper-evident seal on it. A locked box without a seal might still be changed without the receiver noticing.","terms":[["Block cipher","A cipher that transforms one fixed-size block at a time."],["Stream cipher","A cipher that generates a sequence of bytes to combine with the message."],["Authentication tag","A value used to detect if protected data or its attached information was changed."]]},"block-stream":{"plain":"A block cipher handles data in fixed-size pieces. A stream cipher produces a sequence of bytes that can be combined with data of different lengths. A mode of operation explains how to use a block cipher safely for longer messages.","example":"Imagine mailing books in boxes versus feeding pages through a secure scanner. The boxes have a fixed size; the scanner can process a continuing stream. Both still need rules for checking that nobody tampered with the contents.","terms":[["Block","A fixed-size group of bytes, such as AES's 16-byte block."],["Keystream","The sequence of bytes a stream cipher combines with the message."],["Mode","The set of rules for applying a block cipher to data longer than one block."]]},"ecb-cbc-ctr":{"plain":"ECB encrypts every block separately, so equal input blocks produce equal output blocks and reveal patterns. CBC mixes each block with the previous encrypted block. CTR encrypts a changing counter and combines that result with the message. Each mode has strict rules for its IV or nonce.","example":"If a file contains the same 16-byte block many times, ECB produces the same encrypted block each time. That repetition can reveal structure even though the bytes are not readable.","terms":[["ECB","A mode that encrypts each block independently; it usually reveals repeated patterns and should not protect messages."],["IV","An initialization value used to start a mode such as CBC."],["Nonce","A value intended to be used once with a key; repeating it in CTR or GCM can break security."]]},"gcm-xts-siv":{"plain":"These modes solve different problems. GCM encrypts and checks that the data was not changed. XTS is designed for disk sectors but does not provide tamper detection. SIV is designed to remain safer if a nonce is accidentally reused, although it has different trade-offs.","example":"For network traffic, you usually need both privacy and tamper detection, so an authenticated mode such as GCM is common. For a disk sector, XTS can protect the sector's contents but a separate mechanism may be needed to detect changes.","terms":[["Authenticated encryption","Encryption that also checks whether the message or attached data was changed."],["Sector","A fixed-size addressable region on a storage device."],["Nonce misuse","Using a nonce incorrectly, especially repeating it with the same key when the mode forbids that."]]},"padding-auth":{"plain":"Some encryption methods work only with full blocks, so padding adds a few bytes to fill the last block. Authentication checks whether someone changed the encrypted data. In modern software, use an authenticated-encryption library instead of inventing your own padding and checking rules.","example":"For a 16-byte block, a 13-byte message needs three padding bytes. PKCS#7 writes 03 03 03. A complete 16-byte message receives a full extra block of sixteen 10 bytes.","terms":[["Padding","Extra bytes added so data fits a required block size."],["MAC or tag","A value used to detect tampering."],["Padding oracle","A response that tells an attacker whether decrypted padding looked valid, which can leak information."]]},"modular-arithmetic":{"plain":"Modular arithmetic is clock arithmetic. After reaching the limit, counting starts again at zero. Cryptography uses this rule with very large numbers, and modular multiplication and exponentiation are key parts of RSA and Diffie-Hellman.","example":"On a 12-hour clock, 10 plus 5 gives 3. In arithmetic modulo 12, we write 10 + 5 = 3 (mod 12). With modulo 13, 7 times 5 is 35, which leaves remainder 9.","terms":[["Modulus","The number that sets the size of the number cycle."],["Remainder","What is left after division."],["Modular inverse","A value that reverses multiplication under a chosen modulus, when such a value exists."]]},"rsa":{"plain":"RSA uses a public key and a private key. The public key can be shared; the private key must stay secret. The keys are related through a number made by multiplying two large primes. Secure RSA also needs a standard padding scheme; the simple formula alone is not safe for real messages.","example":"For a lesson-sized example, multiplying 5 by 11 gives 55. Real RSA uses much larger primes. The small numbers in a teaching example can be broken immediately and must never protect data.","terms":[["Public key","The part that can be shared so others can encrypt or verify."],["Private key","The secret part used to decrypt or sign."],["Padding","A standard encoding added before the RSA operation to prevent unsafe use of the raw formula."]]},"diffie-hellman":{"plain":"Diffie-Hellman lets two people create the same shared secret even when they communicate over a public network. Each person keeps one number secret and sends a related public value. They can each combine the received value with their own secret to get the same result.","example":"Imagine two people mixing different secret colours into the same public paint. They exchange the mixtures and add their own secret colour again. Both reach the same final mix, while an observer only sees the public mixtures. Real security comes from hard mathematics, not paint.","terms":[["Key exchange","A way for parties to agree on key material."],["Private exponent","A number that must remain secret during the exchange."],["Man-in-the-middle attack","An attacker secretly places themselves between the two parties and pretends to be each one to the other."]]},"ecc":{"plain":"Elliptic-curve cryptography uses special points and a rule for combining them. Multiplying a point by a secret number is efficient, but finding that secret number from the result is believed to be very difficult for classical computers when a suitable curve is used.","example":"You can quickly follow a recipe forward to make a dish, but seeing the finished dish may not tell you every quantity used. That is only an analogy: ECC relies on a carefully defined mathematical operation, not on the difficulty of guessing a recipe.","terms":[["Curve point","A pair of numbers that satisfies the curve's equation."],["Scalar multiplication","Repeatedly applying the curve's point-addition operation using a number."],["ECDH","An elliptic-curve method for agreeing on shared key material."]]},"rsa-pss-ecdsa":{"plain":"A digital signature helps prove that a message came from someone who holds the private key and was not changed afterward. The sender signs; anyone with the matching public key can check. A signature does not hide the message, and implementation details matter.","example":"A software maker signs a release. Your computer checks the signature before trusting that the file came from the expected signer and still matches what was signed.","terms":[["Signature","A cryptographic proof tied to a message and a private key."],["Verification","Using the public key to check a signature."],["Nonce","A one-use number; in ECDSA, unsafe reuse can reveal the private key."]]},"eddsa-bls":{"plain":"EdDSA and BLS are digital-signature families. EdDSA is designed to make signing safer and easier to implement correctly. BLS signatures can be combined from several signers into a compact aggregate signature under suitable rules.","example":"A software update might use one EdDSA signature to prove who published it. A group of validators might use BLS aggregation so many signatures can be represented by one smaller signature plus the required public information.","terms":[["EdDSA","A signature family based on Edwards elliptic curves."],["Aggregate signature","A compact signature that combines signatures from multiple participants under a supported scheme."],["Nonce","A value used during a cryptographic operation that must follow the algorithm's safety rules."]]},"verification-rotation":{"plain":"Verification is the process of checking that a signature matches the message and public key. Key rotation means replacing old keys with new ones on a planned schedule or after a suspected leak. Systems must also know which keys are currently trusted.","example":"A company replaces a signing key every year. Its software needs a trusted way to learn the new public key, stop trusting the retired key, and still verify older releases when required by policy.","terms":[["Trusted key","A public key accepted as belonging to the expected person or system."],["Revocation","Marking a key or certificate as no longer trusted."],["Key rotation","Replacing keys and updating every system that depends on them."]]},"hmac-hkdf":{"plain":"HMAC uses a secret key and a hash function to create a tag that can help check whether a message was changed by someone without the key. HKDF takes secret material and derives separate keys for different uses. Neither one is a replacement for encryption.","example":"A server and client share a secret. They can use HMAC to check that a message was not altered. HKDF can turn shared key material into one key for encryption and a different key for authentication.","terms":[["HMAC","A keyed message-authentication method built from a hash function."],["HKDF","A method for deriving one or more keys from existing secret material."],["Domain separation","Using different labels or contexts so keys for different purposes are not mixed up."]]},"pbkdf2-scrypt-argon2":{"plain":"Passwords are easy for people to choose and often easy for attackers to guess. Password-based key derivation functions make each guess more expensive. PBKDF2 repeats a calculation; scrypt and Argon2 can also require substantial memory. Use a maintained library and current settings.","example":"If a stolen password database lets an attacker test millions of guesses quickly, making each guess take longer reduces how many guesses fit into the same time. A salt also prevents identical passwords from always having identical stored values.","terms":[["KDF","A key-derivation function that turns input material into key material."],["Salt","A public, unique value stored with a password hash to make precomputed attacks harder."],["Memory-hard","Designed so each guess must use a meaningful amount of memory, not only CPU time."]]},"password-hashing":{"plain":"Do not store a password as plain text or as a simple fast hash. Store the result of a password-hashing function with a unique salt and suitable cost settings. A pepper is an additional secret held separately from the password database, but it does not replace a good password hash.","example":"Two users may choose the same password. With different salts, their stored password hashes should still differ. If the database is stolen, the attacker must perform the expensive password check for each guess.","terms":[["Password hash","The stored result used to check a password without saving the original password."],["Salt","A unique value stored beside each password hash."],["Pepper","An extra secret kept outside the password database, often in a secrets manager or HSM."]]},"tls":{"plain":"TLS protects a connection between a client, such as a browser, and a server. During the handshake, they agree on cryptographic settings, establish shared key material, and authenticate the server using certificates. Afterward, they protect the application data with symmetric encryption and integrity checks.","example":"When you open an HTTPS website, the browser checks the server certificate and negotiates keys. The Wi-Fi operator can see that data is moving, but should not be able to read or silently change the protected page contents.","terms":[["Handshake","The opening exchange that agrees on security settings and keys."],["Certificate","A signed statement linking a public key to an identity."],["Session key","A temporary key used to protect data during a connection."]]},"noise-wireguard":{"plain":"Noise is a family of patterns for building secure handshakes. WireGuard is a VPN that uses a carefully chosen pattern and modern cryptographic tools to create an authenticated encrypted tunnel. A VPN protects traffic between endpoints; it does not automatically make every online activity anonymous.","example":"A laptop on public Wi-Fi connects to a work network through WireGuard. Traffic inside the tunnel is protected between the laptop and VPN peer, but websites may still identify the user through accounts, cookies, or other signals.","terms":[["Handshake pattern","A defined order of messages used to authenticate peers and create shared keys."],["VPN tunnel","An encrypted connection carrying network traffic between endpoints."],["Peer","Another device or endpoint participating in the secure connection."]]},"ssh-openpgp-certs":{"plain":"SSH protects remote login and file transfer. OpenPGP supports signed and encrypted messages or files. Certificate systems use a chain of signatures to connect a public key to an identity. In every case, security depends on checking that the key really belongs to the intended party.","example":"The first time you connect to a server with SSH, your computer may ask you to trust its host key. If that key unexpectedly changes later, check why instead of blindly accepting the new one.","terms":[["Host key","A key a server uses to identify itself to SSH clients."],["Certificate authority","An organization or service trusted to issue identity certificates."],["Trust chain","A sequence of trusted signatures connecting a key or certificate to a root of trust."]]},"csprng":{"plain":"A cryptographically secure random number generator creates values that are difficult to predict, even if an attacker sees earlier outputs. Operating systems provide this kind of generator. Do not use simple predictable formulas or Math.random for keys, secret tokens, or nonces.","example":"A website needs a password-reset link. It should use secure random bytes to create the token, rather than a counter, timestamp, or fixed-seed random generator that could be guessed.","terms":[["CSPRNG","A generator designed to produce unpredictable values for security."],["Entropy source","A source of unpredictable input used to seed or refresh the generator."],["Token","A value that grants or identifies access, such as a password-reset link."]]},"drbg-fortuna":{"plain":"A deterministic random bit generator expands secret internal state into many random-looking bits. Its safety depends on a good initial seed and proper state updates. Fortuna is a design that gathers entropy from multiple pools; HMAC_DRBG uses HMAC to update and generate output.","example":"A device may collect unpredictable events during startup and combine them before generating a key. A reliable generator then creates many key bytes without needing a physical random event for every byte.","terms":[["DRBG","A generator that expands secret internal state into output bits."],["Reseed","Refreshing a generator with new entropy."],["State","The internal secret information that controls the generator's future output."]]},"key-management":{"plain":"Good cryptography can still fail if keys are handled badly. Keys need safe generation, restricted access, backups when appropriate, rotation, recovery plans, and secure deletion. A key should be available only to the people and services that need it.","example":"A database encryption key should not be saved next to the encrypted database with the same permissions. If an attacker steals both together, encryption may offer little protection.","terms":[["Key lifecycle","The steps from creating a key to using, rotating, revoking, and destroying it."],["Least privilege","Give each person or service only the access it needs."],["HSM","A hardware security module that protects cryptographic keys and operations."]]},"shamir":{"plain":"Shamir secret sharing splits one secret into several pieces called shares. You choose a threshold: any group with enough shares can rebuild the secret, but a smaller group cannot. This is useful when no single person should control a critical secret.","example":"A secret can be split into five shares with a threshold of three. Any three shares can recover it; one or two shares are not enough. The shares must still be stored and transferred safely.","terms":[["Share","One piece of a split secret."],["Threshold","The minimum number of shares needed to recover the secret."],["Reconstruction","Combining enough shares to recover the original secret."]]},"threshold-sigs":{"plain":"A threshold signature lets a group produce a signature that verifies as one normal signature, while requiring several participants to cooperate. Unlike simply sharing a private key, a good threshold scheme keeps the full key from existing in one place.","example":"A company might require three of five authorized services to approve a signing operation. One stolen service cannot sign alone, and the verifier still checks one signature under the group's public key.","terms":[["Threshold","The number of participants required to approve or sign."],["Distributed key","Key material divided among participants rather than stored in one complete place."],["Aggregate signature","A combination of signatures; not every signature scheme supports aggregation or threshold signing in the same way."]]},"pedersen-vrf":{"plain":"A commitment lets someone choose a value now and reveal it later without being able to change it secretly. A verifiable random function (VRF) produces a result that others can verify came from a particular secret key. Commitments hide a chosen value; VRFs prove how a result was generated.","example":"You commit to a contest prediction before the result is known. Later you reveal the prediction and a secret opening value, and everyone can check it matches the earlier commitment.","terms":[["Commitment","A value that hides a choice now but can be checked when opened later."],["Hiding","The commitment does not reveal the chosen value."],["Binding","The author cannot feasibly open the same commitment to a different value."]]},"sigma-schnorr":{"plain":"A Sigma protocol is a short, interactive proof with three parts: the prover commits, the verifier gives a challenge, and the prover responds. Schnorr proofs use this pattern to show knowledge of a secret without revealing the secret itself.","example":"Someone proves they know the secret number behind a public key. The verifier can check the proof, but the secret number is never sent over the connection.","terms":[["Prover","The person or program making the claim."],["Verifier","The person or program checking the proof."],["Challenge","A value used to test whether the prover's response fits the earlier commitment."]]},"bulletproofs":{"plain":"A range proof can show that a hidden number falls inside a permitted range without revealing the number. Bulletproofs are one way to build such proofs, often used when a system needs to check that a value is valid without exposing it.","example":"A payment system may need to know that a hidden amount is between zero and a maximum value. A range proof helps check that rule without revealing the exact amount.","terms":[["Zero-knowledge proof","A proof that establishes a claim without revealing the secret information behind it."],["Range proof","A proof that a hidden number lies inside a specified interval."],["Commitment","A way to hide a value while binding the author to it."]]},"snarks-starks":{"plain":"zk-SNARKs and zk-STARKs let a prover convince a verifier that a calculation was done correctly without showing all the private data. They differ in proof size, assumptions, setup needs, and verification cost. Neither label alone guarantees that a complete application is secure.","example":"A service could prove that a submitted result follows a required calculation without showing the private inputs. The proof system checks the math, while the application still needs correct rules and trusted input handling.","terms":[["Prover","The party creating the proof."],["Verifier","The party checking the proof."],["Trusted setup","A setup step that some proof systems require and that must be handled under strict assumptions."]]},"ml-kem":{"plain":"ML-KEM is a standardized way for two parties to create matching shared key material over a public connection. It uses lattice-based mathematics and was designed to resist known attacks from both classical and future large-scale quantum computers. It is not itself a message-encryption format.","example":"A client and server use ML-KEM to agree on shared key material, then feed that material into a key-derivation step and an authenticated-encryption system to protect their data.","terms":[["Key encapsulation","A method for sending enough information for two sides to obtain the same secret key material."],["Lattice","A mathematical structure made from combinations of basis vectors."],["Post-quantum cryptography","Cryptography designed to resist known attacks from quantum computers as well as classical computers."]]},"ml-dsa-slhdsa":{"plain":"ML-DSA and SLH-DSA are standardized post-quantum signature schemes. ML-DSA relies on lattice-based mathematics. SLH-DSA relies on hash functions. Both are intended to keep signatures secure against known quantum-era attacks, but they have different size and performance trade-offs.","example":"A future software release could be signed with a post-quantum signature so users can check who published it and whether it was changed. The public key and signature format must be supported by the software doing the check.","terms":[["Digital signature","A checkable proof tied to a message and a private signing key."],["Lattice-based","Built from hard problems involving mathematical lattices."],["Hash-based signature","A signature method whose security relies mainly on cryptographic hash functions."]]},"hash-based-sigs":{"plain":"Hash-based signatures use hash functions as their main building block. Lamport signatures show the core idea but normally use a private signing key only once. XMSS organizes many one-time keys in a Merkle tree so one public key can support a controlled number of signatures.","example":"A Lamport key has secret values for both possible bits. To sign, the sender reveals one value for each bit of the message hash. Reusing that key for more signatures can reveal too much, so reuse rules are essential.","terms":[["Message hash","A fixed-size fingerprint of the message being signed."],["One-time key","A signing key intended to be used for a single signature."],["Merkle tree","A tree of hashes that can prove which leaf belongs to a larger set of keys."]]},"mpc-ot":{"plain":"Secure multiparty computation lets several people calculate an answer together without revealing their private inputs to each other beyond what the answer itself reveals. Oblivious transfer is a smaller building block that lets a receiver choose one item without revealing which item they chose.","example":"Several hospitals want to count how many patients share a condition without sending their patient lists to one another. MPC can help compute the total while keeping the input lists private, under a specified security model.","terms":[["Private input","Data a participant should not reveal to the other participants."],["MPC","A group of protocols for securely computing a result together."],["Oblivious transfer","A protocol where a receiver obtains one chosen item from a set while hiding the choice from the sender."]]},"garbled-circuits":{"plain":"A garbled circuit lets one party prepare a calculation so another party can run it on private input without learning the input itself. The computation is represented as a circuit of simple operations, with cryptographic labels hiding the meaning of the wires.","example":"Two companies want to compare their salaries to find which is larger without sharing the actual salary values. A secure computation can reveal only the comparison result, if designed and deployed correctly.","terms":[["Circuit","A calculation represented as connected logical operations."],["Wire label","A cryptographic value representing a hidden bit inside the circuit."],["Evaluator","The party that evaluates the prepared circuit using its private input."]]},"homomorphic":{"plain":"Homomorphic encryption allows some calculations to be performed on encrypted data. After the result is decrypted, it matches the corresponding calculation on the original data, within the scheme's supported operations and limits.","example":"Imagine a service adding encrypted numbers without seeing the numbers themselves. The owner later decrypts the result and obtains the sum. Real schemes have important limits on which operations and how many operations they support.","terms":[["Ciphertext","The encrypted form of data."],["Homomorphic operation","An operation on ciphertexts that corresponds to an operation on the original data."],["Noise","A value that grows in many schemes and limits how much computation can be done before decryption fails."]]},"diff-linear":{"plain":"Differential cryptanalysis studies how chosen changes to an input affect changes to the output. Linear cryptanalysis looks for statistical relationships between input bits, output bits, and key bits. These techniques help experts test whether a cipher mixes data strongly enough.","example":"If changing one input bit tends to cause a predictable pattern in the output, that pattern may be a clue about the cipher. A good modern cipher is designed to prevent attackers from gaining a practical key advantage this way.","terms":[["Differential","A difference between two inputs or outputs, often measured with XOR."],["Linear approximation","A relationship that holds slightly more often than chance between selected bits."],["Round","One repeated stage of a block cipher's internal processing."]]},"padding-timing":{"plain":"A padding oracle is a system response that leaks whether decrypted data has valid padding. A timing attack measures how long a system takes to respond. Even a small difference can leak secrets when an attacker can repeat the measurement enough times.","example":"If a server returns one message for invalid padding and another for valid padding, attackers can use the difference as a clue. Secure systems avoid exposing such clues and use authenticated encryption correctly.","terms":[["Oracle","A system that reveals a useful yes/no answer through its response."],["Timing side channel","Information revealed by differences in how long operations take."],["Constant-time behavior","Code designed not to take secret-dependent paths or leak secret-dependent timing for the protected operation."]]},"cache-fault":{"plain":"A cache attack watches which data a processor accesses and uses those clues to infer secret-dependent behavior. Fault injection deliberately causes errors, for example with voltage, clock, or physical interference, and studies how the system responds. These attacks target implementation and hardware, not only mathematical algorithms.","example":"A cryptographic routine may access different memory locations depending on a secret key bit. If an attacker can measure cache effects, they may infer that bit. Safer implementations avoid secret-dependent memory access.","terms":[["CPU cache","Small, fast memory near the processor that keeps recently used data."],["Fault injection","Deliberately causing an error in hardware or computation."],["Side-channel defense","Design choices that reduce information leaked through behavior outside the intended output."]]},"lattice-reduction":{"plain":"A lattice is a regular grid of points described by vectors. Lattice-reduction algorithms such as LLL and BKZ try to find shorter, more useful vectors in that grid. They are important in number theory and in studying the security of some public-key systems.","example":"In two dimensions, a poor choice of basis vectors can describe the same grid using long, awkward vectors. Reduction finds a shorter basis that describes the same lattice more conveniently. Higher-dimensional problems are much harder.","terms":[["Lattice","A set of points formed by integer combinations of basis vectors."],["Basis","The vectors used to describe the lattice."],["LLL / BKZ","Algorithms that find reduced bases, with different speed and strength trade-offs."]]},"coppersmith-protocol":{"plain":"Coppersmith's methods can find certain small roots of polynomial equations modulo a number, under strict mathematical conditions. Separately, protocol misuse happens when a sound algorithm is used with the wrong padding, repeated nonces, missing authentication, or unsafe parameters. Real failures often come from how the pieces are combined.","example":"A secure building block can still be unsafe if an application gives it predictable or repeated inputs. A cryptographic review therefore checks the full protocol and its assumptions, not just the name of the algorithm.","terms":[["Modular equation","An equation where values are compared by their remainders under a modulus."],["Protocol misuse","Using a valid cryptographic component in an unsafe way."],["Parameter","A setting, such as a key size or nonce, that affects the method's behavior or security."]]},"constant-time-stegano":{"plain":"Constant-time programming tries to stop secret values from changing how long sensitive code takes or which memory locations it accesses. Steganography has a different goal: hide the fact that a message exists. Hiding a message is not the same as encrypting it.","example":"Encryption turns a message into unreadable ciphertext, but people can still see that a secret message was sent. Steganography might hide message bits inside an image. Constant-time code reduces timing clues that could leak a key while encryption runs.","terms":[["Constant-time code","Code designed to avoid secret-dependent timing and similar observable behavior."],["Steganography","Hiding a message inside another object so its presence is less obvious."],["Encryption","Making a message unreadable without the correct key; it does not necessarily hide that communication occurred."]]}};

/* ============================================================
   Hash helpers (reuse SHA-256 via Web Crypto)
   ============================================================ */
const enc=new TextEncoder();
const toBytes=s=>enc.encode(s);
function hex(bytes){return [...bytes].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function sha256(bytes){
 const buf=await crypto.subtle.digest('SHA-256',bytes);
 return new Uint8Array(buf);
}
async function sha256Hex(bytes){return hex(await sha256(bytes))}
async function hmacSha256(key,msg){
 const k=await crypto.subtle.importKey('raw',key,{name:'HMAC',hash:'SHA-256'},false,['sign']);
 const sig=await crypto.subtle.sign('HMAC',k,msg);
 return new Uint8Array(sig);
}
function bytesToBig(bytes){let n=0n;for(const b of bytes)n=(n<<8n)|BigInt(b);return n}
function bigToBytes(n,len){const out=new Uint8Array(len);for(let i=len-1;i>=0;i--){out[i]=Number(n&0xffn);n>>=8n}return out}
function modexp(b,e,m){let r=1n;b%=m;while(e>0n){if(e&1n)r=(r*b)%m;b=(b*b)%m;e>>=1n}return r}

function demoTiming(text){
 const a=toBytes(text||'default');
 const b=toBytes((text||'default')+'X');
 function badCompare(x,y){if(x.length!==y.length)return false;for(let i=0;i<x.length;i++)if(x[i]!==y[i])return false;return true}
 function goodCompare(x,y){if(x.length!==y.length)return false;let d=0;for(let i=0;i<x.length;i++)d|=x[i]^y[i];return d===0}
 const trials=20000;
 let t0=performance.now();
 for(let i=0;i<trials;i++)badCompare(a,b);
 const badTime=performance.now()-t0;
 t0=performance.now();
 for(let i=0;i<trials;i++)goodCompare(a,b);
 const goodTime=performance.now()-t0;
 return {
  encoded:`input: ${JSON.stringify(text)}\nlength: ${a.length} bytes\n\nbad compare (stops on first mismatch): ${badTime.toFixed(1)} ms for ${trials} runs\ngood compare (constant time):           ${goodTime.toFixed(1)} ms for ${trials} runs\n\ndifference: ${(goodTime-badTime).toFixed(1)} ms (${((goodTime/badTime-1)*100).toFixed(1)}% slower for constant time)`,
  decoded:`The bad compare stops on the first mismatch. That means it takes less time when more of the prefix matches.\n\nAn attacker who can measure the time can learn how many bytes of the MAC or password hash match. They can then guess the next byte by byte.\n\nThe good compare always touches every byte. Its time does not depend on the data, so it leaks nothing.\n\nThis is why HMAC verification must use a constant time comparison function. Real implementations use functions such as hmac.compare_digest in Python or crypto.timingSafeEqual in Node.js.`,
  steps:a.length,units:trials,tokens:2
 };
}

function demoCaesar(text){
 const input=text||'ATTACK AT DAWN';
 const shifted3=caesarCipher(input,3);
 const shifted13=caesarCipher(input,13);
 const affineEnc=affineCipher(input,5,8);
 const affineDec=affineCipher(affineEnc,5,8,true);
 // brute force all 25 shifts and show a few
 const bruteRows=[];
 for(let k=0;k<26;k++){
  const guess=caesarCipher(input,-k);
  if(guess.toUpperCase().includes('ATTACK')||k<3||k===3){bruteRows.push(`shift ${String(k).padStart(2)} : ${guess}`)}
 }
 return {
  encoded:`input            : ${input}\n\nCaesar +3        : ${shifted3}\nCaesar +13 (ROT13): ${shifted13}\nAffine (a=5, b=8): ${affineEnc}\nAffine decoded   : ${affineDec}\n\nBrute force sample:\n${bruteRows.join('\n')}`,
  decoded:`The Caesar cipher shifts every letter by the same amount. There are only 25 possible shifts, so an attacker can try them all in under a second.\n\nThe affine cipher uses C = (a * P + b) mod 26 with gcd(a, 26) = 1. That gives 12 valid a values and 26 b values, or 312 possible keys. Still trivial to brute force.\n\nBoth ciphers preserve the frequency of each letter. A letter that appears often in the plaintext appears just as often in the ciphertext. That is what frequency analysis exploits.`,
  steps:input.length,units:input.length,tokens:2
 };
}
function caesarCipher(s,shift){
 const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
 return [...s.toUpperCase()].map(ch=>{const i=A.indexOf(ch);return i<0?ch:A[(i+shift%26+26)%26]}).join('');
}
function affineCipher(s,a,b,decrypt){
 const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
 const aInv=modInv(a,26);
 return [...s.toUpperCase()].map(ch=>{const i=A.indexOf(ch);if(i<0)return ch;return decrypt?A[((aInv*(i-b))%26+26)%26]:A[((a*i+b)%26+26)%26]}).join('');
}
function modInv(a,m){
 a=((a%m)+m)%m;for(let x=1;x<m;x++)if((a*x)%m===1)return x;throw Error('no inverse');
}

function demoVigenere(text){
 const input=text||'ATTACK AT DAWN';
 const key='LEMON';
 const enc=vigenereCipher(input,key);
 const dec=vigenereCipher(enc,key,true);
 const keyShift=[...key].map(c=>c.charCodeAt(0)-65);
 return {
  encoded:`input     : ${input}\nkeyword   : ${key}\nkey shifts: ${keyShift.join(', ')}\nencrypted : ${enc}\ndecrypted : ${dec}`,
  decoded:`The Vigenere cipher shifts each letter by a different amount from the keyword. The same plaintext letter becomes a different ciphertext letter at different positions, so single letter frequency analysis fails.\n\nBut the keyword repeats. If an attacker finds the key length, they can split the ciphertext into groups, one per key position, and run frequency analysis on each group separately.\n\nA one time pad is like a Vigenere cipher where the key is as long as the message, random and never reused. That version is unbreakable. Any shorter or repeated key is not.`,
  steps:input.length,units:key.length,tokens:2
 };
}
function vigenereCipher(text,key,decrypt){
 const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const k=key.toUpperCase();let ki=0;
 return [...text.toUpperCase()].map(ch=>{
  const i=A.indexOf(ch);if(i<0)return ch;
  const shift=A.indexOf(k[ki%k.length])*(decrypt?-1:1);
  ki++;
  return A[((i+shift)%26+26)%26];
 }).join('');
}

function demoFrequency(text){

 if(letters.length<10)throw Error('Enter more text so frequencies are meaningful.');
 const counts=new Array(26).fill(0);
 for(const c of letters)counts[c.charCodeAt(0)-65]++;

 function unpad(data){
  if(!data.length||data.length%blockSize)throw Error('length not a multiple of block size');

function modInvBig(a,m){

 for(const iters of [100,1000,10000,100000]){
  const t0=performance.now();
  const key=pbkdf2(password,salt,iters);
  const dt=performance.now()-t0;
  rows.push(`iterations ${String(iters).padStart(6)} : ${dt.toFixed(1)} ms, key ${hex(key).slice(0,16)}...`);
 }
 return {
  encoded:`password: ${JSON.stringify(password)}\nsalt    : "fixed demo salt" (in real use this is random per user)\n\n${rows.join('\n')}\n\nEach additional iteration makes both the defender and the attacker slower by the same factor.`,
  decoded:`A password hash must be slow. A normal hash like SHA-256 runs in nanoseconds. An attacker with a GPU can try billions of guesses per second.\n\nPBKDF2 repeats the hash many times. Each user gets a unique random salt, so precomputed tables (rainbow tables) do not work. The iteration count should be tuned so one login takes about 100 to 500 milliseconds on your server.\n\nPBKDF2 is not memory hard, so GPUs and ASICs still do well against it. scrypt and Argon2 add memory cost on top of time cost. Argon2id is the current recommendation from OWASP and the winner of the Password Hashing Competition.\n\nA pepper is an extra secret value stored outside the database. If the database leaks, the attacker still has to break the pepper before they can even start guessing passwords.`,
  steps:4,units:4,tokens:4
 };
}

function demoCsprng(){
 function insecureLcg(seed){
  let state=seed;
  return ()=>{state=(Math.imul(state,1103515245)+12345)>>>0;return (state>>>16)&0xffff};
 }
 const lcg=insecureLcg(42);
 const lcgSeq=Array.from({length:8},()=>lcg().toString(16).padStart(4,'0'));
 const lcg2=insecureLcg(42);
 const lcgSeq2=Array.from({length:8},()=>lcg2().toString(16).padStart(4,'0'));
 const cryptoSeq=[];
 const buf=new Uint8Array(16);
 crypto.getRandomValues(buf);
 for(let i=0;i<8;i++){
  const v=(buf[i*2]<<8)|buf[i*2+1];
  cryptoSeq.push(v.toString(16).padStart(4,'0'));
 }
 const token='';
 const tokenBytes=new Uint8Array(32);
 crypto.getRandomValues(tokenBytes);
 const urlToken=base64Url(tokenBytes);
 return {
  encoded:`insecure LCG, seed 42:\n  ${lcgSeq.join(' ')}\n\nsame LCG, same seed 42 again:\n  ${lcgSeq2.join(' ')}\n  identical: ${lcgSeq.join()===lcgSeq2.join()}\n\ncrypto.getRandomValues:\n  ${cryptoSeq.join(' ')}\n\n32 byte URL safe token:\n  ${urlToken}`,
  decoded:`A linear congruential generator is a simple formula. Given the same seed, it produces the same stream. An attacker who sees a few outputs can often compute the state and predict everything else.\n\nA cryptographically secure generator takes a small amount of real entropy and stretches it. Its output cannot be predicted from previous outputs even with unlimited computation, assuming the internal state stays secret.\n\ncrypto.getRandomValues is the browser's CSPRNG. It draws from the operating system's entropy pool. Always use it for keys, nonces, salts, session tokens and password reset links.\n\nNever use Math.random for anything security related. It uses a similar algorithm to the LCG above.`,
  steps:8,units:24,tokens:24
 };
}
function base64Url(bytes){
 let s='';for(const b of bytes)s+=String.fromCharCode(b);
 return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function demoShamir(text){
 // use SHA-256 of the message as the secret so the input length does not matter
 const bytes=toBytes(text||'my secret is 42');
 const secretBytes=await sha256(bytes);
 const secret=bytesToBig(secretBytes);
 const prime=(1n<<127n)-1n;
 const n=5,k=3;
 const coeffs=[secret%prime];
 const rnd=new Uint8Array(16);
 for(let i=0;i<k-1;i++){
  crypto.getRandomValues(rnd);
  coeffs.push(bytesToBig(rnd)%prime);
 }
 function evalPoly(x){
  let y=0n;
  for(let i=coeffs.length-1;i>=0;i--)y=(y*x+coeffs[i])%prime;
  return y;
 }
 const shares=[];
 for(let x=1;x<=n;x++)shares.push([BigInt(x),evalPoly(BigInt(x))]);
 function reconstruct(selected){
  let total=0n;
  for(let i=0;i<selected.length;i++){
   const[xi,yi]=selected[i];
   let num=1n,den=1n;
   for(let j=0;j<selected.length;j++){
    if(i===j)continue;
    const[xj]=selected[j];
    num=(num*(-xj))%prime;
    den=(den*(xi-xj))%prime;
   }
   total=(total+yi*num*modInvBig(den,prime))%prime;
  }
  return ((total%prime)+prime)%prime;
 }
 const recovered=reconstruct(shares.slice(0,3));
 const recovered2=reconstruct([shares[1],shares[3],shares[4]]);
 return {
  encoded:`secret (SHA-256 of the message, as a number):\n  ${secret.toString(16)}\n\nprime: ${prime.toString(16)}\n\nshares (threshold ${k} of ${n}):\n${shares.map(([x,y])=>`  x=${x}  y=${y.toString(16).slice(0,32)}...`).join('\n')}\n\nreconstruct from shares 1, 2, 3:\n  ${recovered.toString(16)}\n  matches secret: ${recovered===secret}\n\nreconstruct from shares 2, 4, 5:\n  ${recovered2.toString(16)}\n  matches secret: ${recovered2===secret}`,
  decoded:`Shamir secret sharing splits a secret into n shares so that any k of them can rebuild it, but k-1 shares reveal nothing.\n\nThe secret is the value of a random polynomial at x=0. The polynomial has degree k-1, so it is determined by k points. Each share is one point on the curve. With fewer than k points, every possible secret is still equally likely.\n\nHere the secret is a 256 bit hash of the message, so it fits cleanly into a large prime field.\n\nIn practice, the dealer who creates the shares must destroy the original secret. If they keep a copy, the whole scheme is pointless. The prime and the field must be chosen so that the secret is smaller than the prime.`,
  steps:shares.length,units:shares.length,tokens:coeffs.length
 };
}

async function demoSchnorr(){
 // small Schnorr proof over a prime group
 const p=23n,g=5n,q=11n;
 const x=6n;
 const Y=modexp(g,x,p);
 const r=BigInt(Math.floor(Math.random()*Number(q)));
 const R=modexp(g,r,p);
 const c=BigInt(Math.floor(Math.random()*Number(q)));
 const s=(r+c*x)%q;
 const left=modexp(g,s,p);
 const right=(R*modexp(Y,c,p))%p;
 const valid=left===right;
 // Second proof with same r to demonstrate the leak
 const c2=(c+1n)%q;
 const s2=(r+c2*x)%q;
 // from s and s2: x = (s - s2) / (c - c2) mod q
 let leakedX=null;
 try{
  const num=(s-s2+q)%q;
  const den=(c-c2+q)%q;
  const denInv=modInvBig(den,q);
  leakedX=(num*denInv)%q;
 }catch(e){}
 return {
  encoded:`public parameters:\n  p = ${p}  g = ${g}  q = ${q}  (order of g)\n\npublic key:\n  private x = ${x}\n  public  Y = g^x mod p = ${Y}\n\nProof:\n  prover picks r = ${r}\n  commitment R = ${R}\n  verifier sends c = ${c}\n  prover computes s = ${s}\n\nVerify:\n  g^s mod p       = ${left}\n  R * Y^c mod p   = ${right}\n  valid           = ${valid}\n\nSame r used again with challenge c2 = ${c2}:\n  s2 = ${s2}\n  leaked x from the two proofs = ${leakedX}\n  actual x                     = ${x}\n  leak success                 = ${leakedX===x}`,
  decoded:`A Sigma protocol has three moves: commitment, challenge, response. Schnorr proofs use this structure to prove knowledge of a discrete logarithm without revealing it.\n\nThe proof is zero knowledge because R and s reveal nothing about x when r is uniformly random. The verifier learns only that the prover knows some x such that Y = g^x.\n\nThe second part of the demo shows what happens if the same r is used twice. Two equations s = r + c*x and s2 = r + c2*x can be subtracted to solve for x. This is exactly the failure mode that breaks ECDSA when nonces are reused. Real Schnorr and EdDSA implementations derive the nonce deterministically from the private key and the message.`,
  steps:2,units:6,tokens:4
 };
}

async function demoLamport(text){
 const msg=toBytes(text||'hello');
 const bits=Math.min(msg.length*8,32);
 const privateKey=[];
 for(let i=0;i<bits;i++){
  const a=new Uint8Array(32);crypto.getRandomValues(a);
  const b=new Uint8Array(32);crypto.getRandomValues(b);
  privateKey.push([a,b]);
 }
 const publicKey=[];
 for(const[a,b] of privateKey){
  publicKey.push([await sha256(a),await sha256(b)]);
 }
 const sig=[];
 for(let i=0;i<bits;i++){
  const bit=(msg[Math.floor(i/8)]>>(i%8))&1;
  sig.push(privateKey[i][bit]);
 }
 // verify
 let valid=true;
 for(let i=0;i<bits;i++){
  const bit=(msg[Math.floor(i/8)]>>(i%8))&1;
  const h=await sha256(sig[i]);
  if(!bytesEqual(h,publicKey[i][bit])){valid=false;break}
 }
 // sign the same key twice with a different message to show the leak
 const msg2=toBytes((text||'hello')+'!');
 let leaked=0;
 for(let i=0;i<bits;i++){
  const bit1=(msg[Math.floor(i/8)]>>(i%8))&1;
  const bit2=(msg2[Math.floor(i/8)]>>(i%8))&1;
  if(bit1!==bit2)leaked++;
 }
 return {
  encoded:`message        : ${JSON.stringify(text)}\nmessage bits   : ${bits}\n\npublic key     : ${bits} pairs of SHA-256 hashes\nsignature      : ${bits} revealed random values\nsignature verifies: ${valid}\n\nIf the same private key signs a different message:\n  message 2    : ${JSON.stringify((text||'hello')+'!')}\n  bits that differ between message 1 and message 2: ${leaked} of ${bits}`,
  decoded:`A Lamport signature is a one time signature built from hashes. The private key is a set of random values. The public key is the hashes of those values.\n\nTo sign a message, you reveal one value from each pair based on the bits of the message. The verifier hashes the revealed values and checks them against the public key.\n\nA single signature is safe. Two signatures from the same key are not. If the same bit position is signed with different bits in two messages, both private values become public. In the worst case half the private values are revealed, and an attacker can sign new messages whose bits match the revealed positions.\n\nThis is why Lamport keys are called one time. Real hash based signature schemes such as XMSS and SPHINCS+ build many Lamport or Winternitz keys into a Merkle tree so that one public key can sign many messages safely.`,
  steps:bits,units:bits,tokens:bits*2
 };
}

function demoCommit(text){
 const msg=toBytes(text||'The answer is 42');
 // Pedersen style commitment over a small prime group
 const p=23n,g=5n;
 // pick h as a random generator with unknown discrete log
 const h=7n;
 const m=bytesToBig(msg)%(p-1n)+1n;
 const r=BigInt(Math.floor(Math.random()*Number(p-2n)))+1n;
 const C=(modexp(g,m,p)*modexp(h,r,p))%p;
 // try to find a different (m', r') for the same C
 let collision=null;
 for(let m2=1n;m2<=22n;m2++){
  for(let r2=1n;r2<=22n;r2++){
   if(m2===m&&r2===r)continue;
   const C2=(modexp(g,m2,p)*modexp(h,r2,p))%p;
   if(C2===C){collision=[m2,r2];break}
  }
  if(collision)break;
 }
 return {
  encoded:`group:\n  p = ${p}  g = ${g}  h = ${h}\n\ncommitment:\n  message m = ${m}\n  random  r = ${r}\n  C = g^m * h^r mod p = ${C}\n\nopen:\n  reveal m and r, verifier checks g^m * h^r == C  ->  ${(modexp(g,m,p)*modexp(h,r,p))%p===C}\n\nhiding: for any message, C is uniformly distributed over the group because r is random.\nbinding: finding two different (m, r) with the same C requires solving the discrete log of h base g.`,
  decoded:`A commitment is like putting a note in a sealed envelope. You publish the envelope now, open it later, and prove you did not change the contents.\n\nA Pedersen commitment C = g^m * h^r is hiding: no one can learn m from C because r masks it. It is binding: you cannot open C to a different message later, because that would require knowing the discrete log of h base g, which is assumed to be hard.\n\nThese commitments appear in zero knowledge proofs, confidential transactions and range proofs. The setup must ensure that nobody knows the discrete log of h base g. Usually h is derived by hashing a known string to the group.`,
  steps:1,units:1,tokens:1
 };
}

async function runLab(l,initial){
 const inputEl=$('#labInput');
 if(!inputEl)return;
 const input=inputEl.value;
 if(input.length>8000){toast('Please use no more than 8,000 characters');return}
 const encodedEl=$('#labEncoded'), decodedEl=$('#labDecoded');
 const runButton=$('#runLab');
 if(runButton&&runButton.disabled)return;
 if(runButton){runButton.disabled=true;runButton.textContent='Running…'}
 let res;
 try{
  if(!initial){encodedEl.textContent='Running…';decodedEl.textContent=''}
  switch(l.demo){
   case'caesar':res=demoCaesar(input);break;
   case'vigenere':res=demoVigenere(input);break;
   case'frequency':res=demoFrequency(input);break;
   case'xor':res=demoXor(input);break;
   case'aeschacha':res=await demoAesChaCha(input);break;
   case'ecb':res=demoEcb(input);break;
   case'cbcctr':res=demoCbcCtr(input);break;
   case'pkcs7':res=demoPkcs7(input);break;
   case'modmath':res=demoModMath(input);break;
   case'rsa':res=await demoRsa(input);break;
   case'dh':res=demoDh(input);break;
   case'hmac':res=await demoHmac(input);break;
   case'pbkdf2':res=demoPbkdf2(input);break;
   case'csprng':res=demoCsprng();break;
   case'shamir':res=await demoShamir(input);break;
   case'schnorr':res=await demoSchnorr();break;
   case'lamport':res=await demoLamport(input);break;
   case'commit':res=demoCommit(input);break;
   case'timing':res=demoTiming(input);break;
   case'constanttime':res=demoTiming(input);break;
   default:throw Error('No interactive implementation is available for this lesson.');
  }
 }catch(e){
  res={encoded:'Input or runtime error',decoded:e.message,steps:0,units:0,tokens:0};
 }
 if(res.html){encodedEl.innerHTML=res.html}else{encodedEl.textContent=res.encoded}
 decodedEl.textContent=res.decoded;
 if(runButton){runButton.disabled=false;runButton.textContent='Run lab'}
 if(!initial)toast('Lab complete');
}
